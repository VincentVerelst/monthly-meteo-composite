[tool.poetry]
name = "monthly-meteo-composite"
version = "0.0.1a1"
description = "Generate monthly composites for AgERA5"
authors = ["Vincent Verelst <>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/VincentVerelst/monthly-meteo-composite"
repository = "https://github.com/VincentVerelst/monthly-meteo-composite"
keywords = ["AgERA5", "meteorology", "composite", "monthly"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = ">=3.8"
openeo = "==0.42.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
requests-mock = ">=1.8.0"
pre-commit = "*"

[build-system]
requires = ["poetry-core>=1.8.2"]
build-backend = "poetry.core.masonry.api"
