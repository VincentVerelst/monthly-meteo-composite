[project]
name = "monthly-meteo-composite"
version = "0.0.1a1"
description = "Generate monthly composites for AgERA5"
license = { text = "MIT" }
authors = [{ name = "Vincent Verelst" }]
requires-python = ">=3.10,<4.0"
keywords = ["AgERA5", "meteorology", "composite", "monthly"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "openeo==0.42.0",
  "mimir-utils", 
  "pystac==1.11.0",
  "pystac-client==0.9.0",
]

[project.urls]
Homepage = "https://github.com/VincentVerelst/monthly-meteo-composite"
Repository = "https://github.com/VincentVerelst/monthly-meteo-composite"

# ---- uv configuration ----
[dependency-groups]
dev = [
  "pytest>=7.4.0",
  "requests-mock>=1.8.0",
  "pre-commit",
]

[tool.uv.sources]
mimir-utils = { index = "vito-artifactory" }

[[tool.uv.index]]
name = "vito-artifactory"
url = "https://artifactory.repo.vito.be/artifactory/api/pypi/ds-projects-pypi-local/simple/"
explicit = true

# ---- build backend ----
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/test_job", "src/meteo_composite", "src/postprocess"]

