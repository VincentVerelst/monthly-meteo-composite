[tool.poetry]
name = "monthly-meteo-composite"
version = "0.0.1a1"
description = "Generate monthly composites for AgERA5"
authors = ["Vincent Verelst <>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/VincentVerelst/monthly-meteo-composite"
repository = "https://github.com/VincentVerelst/monthly-meteo-composite"
keywords = ["AgERA5", "meteorology", "composite", "monthly"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[[tool.poetry.source]]
name = "vito-artifactory"
url = "https://artifactory.repo.vito.be/artifactory/api/pypi/ds-projects-pypi-local/simple/"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
openeo = "==0.42.0"
mimir-utils = { version = "0.10.1", source = "vito-artifactory" }

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
requests-mock = ">=1.8.0"
pre-commit = "*"

[build-system]
requires = ["poetry-core>=1.8.2"]
build-backend = "poetry.core.masonry.api"
